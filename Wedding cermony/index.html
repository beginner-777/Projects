<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aarooba &amp; Junaid</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Amiri:wght@400;700&family=Great+Vibes&display=swap">
<style>
  :root{
    --maroon-1:#4a0e1a; --maroon-2:#2c0810; --maroon-3:#1c0509;
    --gold:#c9a227; --gold-light:#e6c65a; --gold-pale:#f2dca0;
    --emerald:#0f5132;
    --cream:#f5e8c8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; overflow-x:hidden; background:var(--maroon-3); }
  body{ font-family:'Cormorant Garamond', serif; color:var(--cream); overscroll-behavior:none; }
  img{ max-width:100%; display:block; }

  .bg-ambient{
    position:fixed; inset:0; z-index:0;
    background: radial-gradient(ellipse at 50% 0%, var(--maroon-1) 0%, var(--maroon-2) 55%, var(--maroon-3) 100%);
  }
  .bg-ambient::before{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(201,162,39,0.16) 1px, transparent 1.4px);
    background-size: 24px 24px; opacity:.55;
  }

  .stage{
    position:fixed; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .7s ease;
    padding: 24px 18px;
  }
  .stage.active{ opacity:1; pointer-events:auto; z-index:2; }

  .frame-gold{
    position:absolute; inset:14px; border:1.5px solid rgba(201,162,39,.55); border-radius:8px; pointer-events:none;
  }
  .frame-gold::before{ content:""; position:absolute; inset:6px; border:1px solid rgba(201,162,39,.28); border-radius:5px; }

  /* ---------- STAGE 1: ENVELOPE ---------- */
  #stage-envelope .inner{ display:flex; flex-direction:column; align-items:center; gap:26px; }
  .lockup-label{ font-family:'Cinzel Decorative', serif; font-size:clamp(11px,3vw,13px); letter-spacing:5px; color:var(--gold-light); text-transform:uppercase; text-align:center; }

  .envelope-3d{ position:relative; width:min(72vw,236px); aspect-ratio:220/172; perspective:900px; filter: drop-shadow(0 20px 22px rgba(0,0,0,.55)); cursor:pointer; }
  .env-shadow{ position:absolute; left:10%; right:10%; bottom:-10%; height:10%; background:radial-gradient(ellipse, rgba(0,0,0,.45), transparent 72%); filter:blur(3px); }
  .env-body-svg, .env-flap-svg{ position:absolute; inset:0; width:100%; height:100%; }
  .env-flap-svg{ transform-origin:50% 0%; transition: transform .75s cubic-bezier(.6,.1,.25,1); }
  .envelope-3d.open .env-flap-svg{ transform: rotateX(-160deg); }
  .env-card{
    position:absolute; left:8%; right:8%; top:14%; height:64%;
    background: linear-gradient(160deg,#fff8e8,#f0dfb6);
    border-radius:2px; box-shadow:0 6px 16px rgba(0,0,0,.3), 0 0 0 1px rgba(201,162,39,.5);
    opacity:0; transform:translateY(6%); transition: transform .6s ease .3s, opacity .3s ease .3s;
    z-index:1;
  }
  .envelope-3d.open .env-card{ opacity:1; transform:translateY(-38%); }
  .seal{
    position:absolute; top:33%; left:50%; transform:translate(-50%,0); width:22%; aspect-ratio:1;
    border-radius:50%; z-index:3;
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 55%, #8a6b1c 100%);
    box-shadow:0 6px 14px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center;
    transition: opacity .3s ease, transform .3s ease;
  }
  .seal svg{ width:52%; height:52%; }
  .envelope-3d.open .seal{ opacity:0; transform:translate(-50%,-6px) scale(.7); }
  .tassel{ position:absolute; top:56%; left:50%; transform:translateX(-50%); z-index:2; transition:opacity .3s ease; }
  .envelope-3d.open .tassel{ opacity:0; }

  .tap-hint{ font-family:'Cormorant Garamond', serif; font-style:italic; font-size:clamp(13px,3.6vw,16px); letter-spacing:3px; color:var(--gold-light); text-align:center; }
  .diamond{ width:7px; height:7px; background:var(--gold-light); transform:rotate(45deg); margin:10px auto 0; }

  .burst-layer{ position:absolute; inset:0; pointer-events:none; overflow:visible; }
  .particle{ position:absolute; width:5px; height:5px; border-radius:50%; background:var(--gold-light); box-shadow:0 0 8px 2px rgba(230,198,90,.7); animation: particle-float 1.1s ease-out forwards; }
  @keyframes particle-float{ 0%{ opacity:0; transform:translate(0,0) scale(.4);} 15%{opacity:1;} 100%{ opacity:0; transform: translate(var(--dx), var(--dy)) scale(1);} }
  .fly-out{ position:absolute; top:44%; left:50%; width:34px; opacity:0; animation: fly-away 1.2s ease-out forwards; }
  .fly-out.left{ animation-name: fly-away-left; }
  @keyframes fly-away{ 0%{opacity:0; transform:translate(-50%,-50%) scale(.5) rotate(0deg);} 20%{opacity:1;} 100%{opacity:0; transform:translate(120px,-160px) scale(1) rotate(24deg);} }
  @keyframes fly-away-left{ 0%{opacity:0; transform:translate(-50%,-50%) scale(.5) rotate(0deg);} 20%{opacity:1;} 100%{opacity:0; transform:translate(-140px,-140px) scale(1) rotate(-24deg);} }

  /* ---------- STAGE 2: REVEAL ---------- */
  #stage-reveal .inner{ max-width:420px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:22px; cursor:pointer; }
  .arabic{ color:var(--gold-pale); font-family:'Amiri', serif; font-size:clamp(20px,5.6vw,27px); line-height:1.9; text-shadow:0 0 18px rgba(233,205,143,.35); }
  .divider-row{ display:flex; align-items:center; gap:10px; }
  .divider-line{ height:1px; width:56px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .reveal-text{ font-family:'Cinzel Decorative', serif; color:var(--gold-pale); font-size:clamp(15px,4.6vw,21px); letter-spacing:2px; line-height:1.7; text-shadow:0 0 24px rgba(242,220,160,.4); }
  .reveal-hint{ font-size:13px; letter-spacing:2px; color:rgba(242,220,160,.55); font-style:italic; margin-top:4px; }

  /* ---------- STAGE 3: MAIN ---------- */
  #stage-main{ align-items:flex-start; padding-top:38px; padding-bottom:38px; overflow-y:auto; }
  .card{ position:relative; width:100%; max-width:400px; margin:0 auto; }
  .corner-img{ position:absolute; width:64px; opacity:.85; z-index:2; }
  .corner-img.tl{ top:-6px; left:-6px; } .corner-img.tr{ top:-6px; right:-6px; transform:scaleX(-1); }
  .top-label{ text-align:center; font-family:'Cinzel Decorative', serif; font-size:12px; letter-spacing:5px; color:var(--gold-pale); margin-bottom:16px; }
  .photo-frame{ width:100%; aspect-ratio:620/346; border-radius:4px; overflow:hidden; background:var(--maroon-3);
    box-shadow:0 14px 26px rgba(0,0,0,.5), 0 0 0 1.5px var(--gold), 0 0 0 5px rgba(201,162,39,.2); margin-bottom:20px; }
  .photo-frame img{ width:100%; height:100%; object-fit:contain; }
  .names{ text-align:center; font-family:'Cinzel Decorative', serif; font-size:clamp(9.5px,3.4vw,17px); letter-spacing:1px; color:var(--cream); margin-bottom:10px; white-space:nowrap; }
  .divider-mid{ width:90px; height:1px; margin:0 auto 22px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }

  .events{ display:flex; flex-direction:column; gap:14px; }
  .ev-box{ height:auto; min-height:88px; border-radius:8px; position:relative; display:flex; align-items:center; padding:14px 16px;
    box-shadow:0 10px 20px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.14); cursor:pointer; border:none; text-align:left;
    transition: transform .2s ease; font-family:inherit; width:100%; }
  .ev-box:active{ transform:scale(.98); }
  .ev-icon{ width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:rgba(255,255,255,.14); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4); }
  .ev-icon img{ width:70%; }
  .ev-text{ margin-left:14px; }
  .ev-name{ font-family:'Cinzel Decorative', serif; font-size:14px; letter-spacing:3px; }
  .ev-tag{ font-size:12px; font-style:italic; opacity:.85; margin-top:3px; }
  .ev-arrow{ margin-left:auto; opacity:.8; flex-shrink:0; }
  .ev-box.mehndi{ background: linear-gradient(120deg,#caa02c 0%,#8a6b14 100%); color:#2e2308; }
  .ev-box.baraat{ background: linear-gradient(120deg,#7a1a2d 0%,#3a0a15 100%); color:#f2dca0; box-shadow:0 10px 22px rgba(0,0,0,.45), inset 0 0 0 1.5px var(--gold); }
  .ev-box.walima{ background: linear-gradient(120deg,#d8c7ae 0%,#a9917a 100%); color:#3a2e22; }

  /* credit tag */
  .credit-wrap{ display:flex; justify-content:flex-end; margin-top:26px; position:relative; }
  .credit-tag{ font-family:'Cormorant Garamond', serif; font-style:italic; font-size:12px; letter-spacing:1.5px; color:rgba(242,220,160,.75);
    background:rgba(255,255,255,.06); border:1px solid rgba(201,162,39,.4); border-radius:999px; padding:6px 14px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .credit-tag svg{ width:12px; height:12px; opacity:.8; }
  .credit-panel{ position:absolute; bottom:calc(100% + 10px); right:0; min-width:220px; text-align:center;
    background:linear-gradient(160deg,#3a0f1c,#20080f); border:1px solid rgba(201,162,39,.5); border-radius:10px; padding:16px 20px;
    box-shadow:0 14px 30px rgba(0,0,0,.5); opacity:0; transform:translateY(8px) scale(.96); pointer-events:none; transition:all .3s ease; }
  .credit-panel.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .credit-caption{ font-family:'Cormorant Garamond', serif; font-style:italic; font-size:11px; letter-spacing:2px; color:var(--gold-pale); text-transform:uppercase; }
  .credit-name{ font-family:'Great Vibes', cursive; font-size:32px; color:var(--gold-light); margin-top:4px; text-shadow:0 0 16px rgba(230,198,90,.4); }

  /* ---------- POPUP ---------- */
  .popup-overlay{ position:fixed; inset:0; z-index:20; background:rgba(10,4,6,.6); backdrop-filter:blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding:40px 18px; opacity:0; pointer-events:none; transition:opacity .35s ease; overflow-y:auto; }
  .popup-overlay.show{ opacity:1; pointer-events:auto; }
  .popup-card{ position:relative; width:100%; max-width:400px; border-radius:10px; margin:auto;
    box-shadow:0 30px 70px rgba(0,0,0,.6); transform:scale(.9) translateY(14px); transition:transform .4s cubic-bezier(.2,.8,.3,1); padding:26px 22px 30px; }
  .popup-overlay.show .popup-card{ transform:scale(1) translateY(0); }
  .popup-frame{ position:absolute; inset:10px; border:1.5px solid rgba(255,255,255,.35); border-radius:6px; pointer-events:none; }
  .pop-corner{ position:absolute; width:70px; opacity:.9; z-index:1; }
  .pop-corner.tl{ top:2px; left:2px; } .pop-corner.tr{ top:2px; right:2px; transform:scaleX(-1); }
  .pop-corner.bl{ bottom:2px; left:2px; transform:scaleY(-1); } .pop-corner.br{ bottom:2px; right:2px; transform:scale(-1,-1); }
  .pop-photo{ width:150px; height:150px; margin:6px auto 14px; border-radius:50%; overflow:hidden; position:relative; z-index:2; }
  .pop-photo img{ width:100%; height:100%; object-fit:cover; object-position:50% 24%; }
  .pop-title{ position:relative; z-index:2; text-align:center; font-family:'Cinzel Decorative', serif; font-size:26px; letter-spacing:7px; }
  .pop-sub{ position:relative; z-index:2; text-align:center; font-style:italic; font-size:13px; opacity:.85; margin-top:4px; }
  .pop-div{ position:relative; z-index:2; width:100px; height:1px; margin:16px auto; background:linear-gradient(90deg,transparent,currentColor,transparent); opacity:.6; }
  .pop-fields{ position:relative; z-index:2; display:flex; flex-direction:column; gap:16px; }
  .pop-field .k{ font-family:'Cinzel Decorative', serif; font-size:10px; letter-spacing:2.5px; opacity:.75; }
  .pop-field .v{ font-size:17px; margin-top:4px; padding-bottom:6px; border-bottom:1px solid currentColor; opacity:.9; }
  .pop-map{ position:relative; z-index:2; display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-size:13px; letter-spacing:1px; text-decoration:none; color:inherit; border:1px solid currentColor; border-radius:999px; padding:8px 16px; opacity:.9; }
  .pop-map svg{ width:14px; height:14px; }

  .pal-mehndi{ background: linear-gradient(165deg,#caa02c 0%,#5c460d 85%); color:#fbf0d6; }
  .pal-baraat{ background: linear-gradient(165deg,#5c1023 0%,#280610 85%); color:#f2dca0; }
  .pal-walima{ background: linear-gradient(165deg,#d8c7ae 0%,#8f7a68 85%); color:#3a2e22; }

  .close-btn{ position:relative; z-index:3; width:42px; height:42px; border-radius:50%; margin:20px auto 0;
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 60%, #8a6b1c); display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 14px rgba(0,0,0,.4); cursor:pointer; border:none; }
  .close-btn svg{ width:16px; height:16px; }

  @media (max-width:360px){ .pop-photo{ width:120px; height:120px; } .pop-title{ font-size:22px; letter-spacing:5px; } }
</style>
</head>
<body>

<div class="bg-ambient"></div>

<!-- STAGE 1: ENVELOPE -->
<section id="stage-envelope" class="stage active">
  <div class="inner">
    <div class="lockup-label">Wedding Ceremony</div>
    <div class="envelope-3d" id="envelope" onclick="openEnvelope()">
      <div class="burst-layer" id="burstLayer"></div>
      <div class="env-shadow"></div>
      <svg class="env-body-svg" viewBox="0 0 220 172" preserveAspectRatio="none">
        <defs>
          <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6a1329"/><stop offset="100%" stop-color="#310810"/>
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="214" height="166" rx="5" fill="url(#bodyG)" stroke="#c9a227" stroke-width="1.4"/>
        <rect x="3" y="150" width="214" height="19" fill="#c9a227" opacity="0.13"/>
      </svg>
      <div class="env-card"></div>
      <svg class="env-flap-svg" id="envFlap" viewBox="0 0 220 172" preserveAspectRatio="none">
        <defs>
          <linearGradient id="flapG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7c1c30"/><stop offset="100%" stop-color="#4a0e1a"/>
          </linearGradient>
        </defs>
        <polygon points="3,3 217,3 110,100" fill="url(#flapG)" stroke="#c9a227" stroke-width="1.3"/>
      </svg>
      <div class="seal" id="envSeal"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L14 9 L21 9 L15.5 13.5 L17.5 21 L12 16.5 L6.5 21 L8.5 13.5 L3 9 L10 9 Z" fill="#3a0a15"/></svg></div>
      <svg class="tassel" id="envTassel" width="18" height="40" viewBox="0 0 18 40"><line x1="9" y1="0" x2="9" y2="22" stroke="#c9a227" stroke-width="1.2"/><circle cx="9" cy="27" r="5" fill="#c9a227"/><circle cx="9" cy="27" r="2" fill="#5c1023"/></svg>
    </div>
    <div class="tap-hint">TAP TO OPEN<div class="diamond"></div></div>
  </div>
</section>

<!-- STAGE 2: REVEAL -->
<section id="stage-reveal" class="stage">
  <div class="inner" onclick="goMain()">
    <div class="arabic">النِّكَاحُ سُنَّتِي، فَمَنْ رَغِبَ عَنْ<br>سُنَّتِي فَلَيْسَ مِنِّي</div>
    <div class="divider-row"><div class="divider-line"></div><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="#c9a227"/></svg><div class="divider-line"></div></div>
    <div class="reveal-text">Mr. &amp; Mrs. Shakeel<br>request the honor of your presence</div>
    <div class="reveal-hint">tap to continue</div>
  </div>
</section>

<!-- STAGE 3: MAIN -->
<section id="stage-main" class="stage">
  <div class="card">
    <img class="corner-img tl" src="baraat-corner.png">
    <img class="corner-img tr" src="baraat-corner.png">
    <div class="top-label">Wedding Ceremony</div>
    <div class="photo-frame"><img src="hero-couple.jpg" alt="Aarooba & Junaid"></div>
    <div class="names">AROOBA SHAKEEL &amp; JUNAID SADDIQUE</div>
    <div class="divider-mid"></div>
    <div class="events">
      <button class="ev-box mehndi" onclick="openPopup('mehndi')">
        <div class="ev-icon"><svg width="27" height="27" viewBox="0 0 24 24">
          <g fill="currentColor">
            <ellipse cx="12" cy="6.4" rx="2.5" ry="4" transform="rotate(0 12 12)"/>
            <ellipse cx="12" cy="6.4" rx="2.5" ry="4" transform="rotate(60 12 12)"/>
            <ellipse cx="12" cy="6.4" rx="2.5" ry="4" transform="rotate(120 12 12)"/>
            <ellipse cx="12" cy="6.4" rx="2.5" ry="4" transform="rotate(180 12 12)"/>
            <ellipse cx="12" cy="6.4" rx="2.5" ry="4" transform="rotate(240 12 12)"/>
            <ellipse cx="12" cy="6.4" rx="2.5" ry="4" transform="rotate(300 12 12)"/>
          </g>
          <circle cx="12" cy="12" r="2.1" fill="currentColor" opacity=".55"/>
        </svg></div>
        <div class="ev-text"><div class="ev-name">MEHNDI</div><div class="ev-tag">Festivities begin</div></div>
        <svg class="ev-arrow" width="16" height="16" viewBox="0 0 16 16"><path d="M5 2 L11 8 L5 14" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
      <button class="ev-box baraat" onclick="openPopup('baraat')">
        <div class="ev-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1 C12.8 7 13 11.2 23 12 C13 12.8 12.8 17 12 23 C11.2 17 11 12.8 1 12 C11 11.2 11.2 7 12 1 Z"/>
        </svg></div>
        <div class="ev-text"><div class="ev-name">BARAAT</div><div class="ev-tag">A royal procession</div></div>
        <svg class="ev-arrow" width="16" height="16" viewBox="0 0 16 16"><path d="M5 2 L11 8 L5 14" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
      <button class="ev-box walima" onclick="openPopup('walima')">
        <div class="ev-icon"><svg width="28" height="18" viewBox="0 0 32 20" fill="currentColor">
          <circle cx="8" cy="12" r="6"/><circle cx="16" cy="8" r="7"/><circle cx="24" cy="12" r="6"/>
        </svg></div>
        <div class="ev-text"><div class="ev-name">WALIMA</div><div class="ev-tag">The reception</div></div>
        <svg class="ev-arrow" width="16" height="16" viewBox="0 0 16 16"><path d="M5 2 L11 8 L5 14" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
    </div>

    <div class="credit-wrap">
      <div class="credit-panel" id="creditPanel">
        <div class="credit-caption">Created and Developed by</div>
        <div class="credit-name">Musfirah Shakeel</div>
      </div>
      <div class="credit-tag" id="creditTag" onclick="toggleCredit(event)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 21 C6 15 2 11 2 7 C2 4 4.5 2 7.5 2 C9.5 2 11 3 12 4.5 C13 3 14.5 2 16.5 2 C19.5 2 22 4 22 7 C22 11 18 15 12 21 Z" stroke="currentColor" stroke-width="1.4"/></svg>
        Created by
      </div>
    </div>
  </div>
</section>

<!-- POPUP -->
<div class="popup-overlay" id="popupOverlay" onclick="if(event.target===this) closePopup()">
  <div class="popup-card" id="popupCard">
    <div class="popup-frame"></div>
    <button class="close-btn" onclick="closePopup()"><svg viewBox="0 0 16 16"><path d="M2 2 L14 14 M14 2 L2 14" stroke="#3a0a15" stroke-width="1.6"/></svg></button>
  </div>
</div>

<script>
  const eventData = {
    mehndi: {
      title: 'MEHNDI', subtitle: 'Festivities Begin',
      photo: 'mehndi-couple.jpg', paletteClass: 'pal-mehndi', corner: 'mehndi-corner.png',
      fields: [
        {label:'DATE', value:'October 16, 2026'},
        {label:'TIME', value:'8:00 PM'},
        {label:'VENUE', value:'Hotel New Royal Palace'},
        {label:'ADDRESS', value:'53 Khayaban-e-Firdousi, Block A, Phase 1, Johar Town, Lahore'}
      ],
      mapsUrl: 'https://maps.app.goo.gl/JyZgeT3uwiKWp3xV6'
    },
    baraat: {
      title: 'BARAAT', subtitle: 'A Royal Procession',
      photo: 'baraat-couple.jpg', paletteClass: 'pal-baraat', corner: 'baraat-corner.png',
      fields: [
        {label:'DATE', value:'October 17, 2026'},
        {label:'RECEPTION', value:'7:00 PM'},
        {label:'DINNER', value:'8:00 PM'},
        {label:'RUKHSATI', value:'9:30 PM'},
        {label:'VENUE', value:'Lasani Palace'},
        {label:'ADDRESS', value:'Harbanspura Road, Taj Bagh Scheme, Lahore'}
      ],
      mapsUrl: 'https://maps.app.goo.gl/ib36q1yvefhEP2VH6'
    },
    walima: {
      title: 'WALIMA', subtitle: 'The Reception',
      photo: 'walima-couple.jpg', paletteClass: 'pal-walima', corner: null,
      fields: [
        {label:'DATE', value:'October 18, 2026'},
        {label:'TIME', value:'7:00 PM'},
        {label:'VENUE', value:'Marabelle by Zafar Group'},
        {label:'ADDRESS', value:'Saddar Town, Lahore'}
      ],
      mapsUrl: 'https://maps.app.goo.gl/5p8CtenFUNExftwp8'
    }
  };

  function showStage(id){
    document.querySelectorAll('.stage').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function spawnParticles(){
    const layer = document.getElementById('burstLayer');
    for(let i=0;i<14;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = Math.random()*Math.PI*2;
      const dist = 60 + Math.random()*80;
      p.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
      p.style.setProperty('--dy', (Math.sin(angle)*dist - 30)+'px');
      p.style.left = '50%'; p.style.top='38%';
      p.style.animationDelay = (Math.random()*0.4)+'s';
      layer.appendChild(p);
      setTimeout(()=>p.remove(), 1600);
    }
    const flyRight = document.createElement('div');
    flyRight.innerHTML = butterflySVG('#e6c65a');
    flyRight.className = 'fly-out';
    layer.appendChild(flyRight);
    const flyLeft = document.createElement('div');
    flyLeft.innerHTML = butterflySVG('#f2dca0');
    flyLeft.className = 'fly-out left';
    layer.appendChild(flyLeft);
    setTimeout(()=>{ flyRight.remove(); flyLeft.remove(); }, 1400);
  }

  function butterflySVG(color){
    return `<svg width="34" height="28" viewBox="-2 -4 60 50">
      <path d="M30 8 C26 3 24 1 21 0" stroke="#3a0a15" stroke-width="1" fill="none"/>
      <path d="M30 8 C34 3 36 1 39 0" stroke="#3a0a15" stroke-width="1" fill="none"/>
      <path d="M30 16 C46 1 60 6 55 22 C50 31 37 27 30 16 Z" fill="${color}" stroke="#7a1a2d" stroke-width="0.6"/>
      <path d="M30 16 C14 1 0 6 5 22 C10 31 23 27 30 16 Z" fill="${color}" stroke="#7a1a2d" stroke-width="0.6"/>
      <path d="M30 21 C41 24 47 36 37 43 C31 41 27 30 30 21 Z" fill="${color}" stroke="#7a1a2d" stroke-width="0.6" opacity=".94"/>
      <path d="M30 21 C19 24 13 36 23 43 C29 41 33 30 30 21 Z" fill="${color}" stroke="#7a1a2d" stroke-width="0.6" opacity=".94"/>
      <ellipse cx="30" cy="23" rx="2.1" ry="16" fill="#3a0a15"/>
    </svg>`;
  }

  let opened = false;
  function openEnvelope(){
    if(opened) return;
    opened = true;
    document.getElementById('envelope').classList.add('open');
    spawnParticles();
    setTimeout(()=>{ showStage('stage-reveal'); }, 1250);
    setTimeout(()=>{ goMainAuto(); }, 10500);
  }

  let advanced = false;
  function goMain(){
    if(advanced) return;
    advanced = true;
    showStage('stage-main');
  }
  function goMainAuto(){ goMain(); }

  function openPopup(key){
    const d = eventData[key];
    const card = document.getElementById('popupCard');
    card.className = 'popup-card ' + d.paletteClass;
    let cornersHtml = '';
    if(d.corner){
      cornersHtml = `<img class="pop-corner tl" src="${d.corner}"><img class="pop-corner tr" src="${d.corner}">
                     <img class="pop-corner bl" src="${d.corner}"><img class="pop-corner br" src="${d.corner}">`;
    }
    const fieldsHtml = d.fields.map(f => `
      <div class="pop-field"><div class="k">${f.label}</div><div class="v">${f.value}</div></div>
    `).join('');
    const mapHtml = d.mapsUrl ? `<div style="text-align:center; position:relative; z-index:2;">
      <a class="pop-map" href="${d.mapsUrl}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21 C7 16 4 12.4 4 9 C4 5 7.5 2 12 2 C16.5 2 20 5 20 9 C20 12.4 17 16 12 21 Z"/><circle cx="12" cy="9" r="2.4" fill="currentColor" stroke="none"/></svg>
        View on Map
      </a></div>` : '';
    card.innerHTML = `
      <div class="popup-frame"></div>
      ${cornersHtml}
      <div class="pop-photo"><img src="${d.photo}"></div>
      <div class="pop-title">${d.title}</div>
      <div class="pop-sub">${d.subtitle}</div>
      <div class="pop-div"></div>
      <div class="pop-fields">${fieldsHtml}</div>
      ${mapHtml}
      <button class="close-btn" onclick="closePopup()"><svg viewBox="0 0 16 16"><path d="M2 2 L14 14 M14 2 L2 14" stroke="#3a0a15" stroke-width="1.6"/></svg></button>
    `;
    document.getElementById('popupOverlay').classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closePopup(){
    document.getElementById('popupOverlay').classList.remove('show');
    document.body.style.overflow = '';
  }

  function toggleCredit(e){
    e.stopPropagation();
    document.getElementById('creditPanel').classList.toggle('show');
  }
  document.addEventListener('click', function(e){
    const panel = document.getElementById('creditPanel');
    const tag = document.getElementById('creditTag');
    if(panel.classList.contains('show') && !panel.contains(e.target) && e.target!==tag && !tag.contains(e.target)){
      panel.classList.remove('show');
    }
  });
</script>
</body>
